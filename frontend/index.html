<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8" />
    <title>zapadina-app</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
    <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

</head>
<body>

<div id="controls">
    <select id="regionSelect" ></select>
    <button onclick="loadRegion()">Открыть</button>
    <button onclick="downloadKML()">Скачать KML</button>
</div>


<div id="processingWidget" style="display:none;">

    <button id="closeProcessingWidget" style="display:none;">✖</button>

    <div id="processingText">Обработка...</div>
    <div id="processingSpinner"></div>

    <button id="cancelBtn">Отменить</button>

    <button id="showResultsBtn" style="display:none;">
        Показать новые западины
    </button>
</div>

<div id="confirmModal" class="modal hidden">
    <div class="modalContent">
        <div class="modalText">Удалить западину?</div>

        <div class="modalButtons">
            <button id="confirmYes">Удалить</button>
            <button id="confirmNo">Отмена</button>
        </div>
    </div>
</div>


<div id="map"></div>

<script src="/static/app.js"></script>
</body>
</html>
